text
cdrom

lang en_US.UTF-8
keyboard us
timezone UTC --utc

network --bootproto=dhcp --device=link --activate --onboot=on

rootpw --plaintext packer
firewall --enabled --service=ssh
selinux --enforcing
services --enabled="sshd,chronyd"

ignoredisk --only-use=sda
zerombr
clearpart --all --initlabel
autopart --type=lvm

bootloader --append="console=ttyS0,115200n8"
reboot

%packages
@^minimal-environment
openssh-server
openscap-scanner
scap-security-guide
%end

%post --log=/root/ks-post.log
# Proxmox builder discovers guest IP through qemu-guest-agent before SSH starts.
dnf -y install qemu-guest-agent
systemctl enable qemu-guest-agent

# Ensure first-boot SSH auth matches Packer communicator settings.
echo 'root:packer' | chpasswd
passwd -u root

cat > /etc/ssh/sshd_config.d/99-packer.conf <<'EOF'
PermitRootLogin yes
PasswordAuthentication yes
EOF

systemctl enable sshd
%end
